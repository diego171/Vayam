name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          rm -rf proyecto
          mkdir proyecto
          unzip -o 1.zip -d proyecto

          echo "=== Archivos extraídos ==="
          find proyecto -maxdepth 5 -type f | sort

      - name: Localizar proyecto Android
        run: |
          echo "=== Buscando settings.gradle ==="

          SETTINGS=$(find proyecto -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en: $ROOT"

          echo "=== Contenido del proyecto ==="
          ls -la "$ROOT"

          echo "=== Preparando proyecto ==="

          rm -rf app
          rm -f build.gradle
          rm -f settings.gradle
          rm -f gradle.properties

          cp -r "$ROOT"/. .

          echo "=== Contenido final ==="
          ls -la

          echo "=== Verificando archivos ==="

          test -f settings.gradle || {
            echo "ERROR: Falta settings.gradle"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: Falta build.gradle"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERROR: Falta app/build.gradle"
            exit 1
          }

          echo "✓ settings.gradle encontrado"
          echo "✓ build.gradle encontrado"
          echo "✓ app/build.gradle encontrado"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Limpiar proyecto
        run: |
          gradle clean --stacktrace

      - name: Compilar APK
        run: |
          echo "=== INICIANDO COMPILACIÓN ==="
          gradle :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          echo "=== APK GENERADO ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "✓ APK generado correctamente"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-de-Unidad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
